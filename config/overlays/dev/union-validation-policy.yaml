apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: validate-union-service-accounts
  annotations:
    policies.kyverno.io/title: Validate Union service account names and allowlist hosts
    policies.kyverno.io/description: Rejects invalid service account names and hostnames before the operator creates downstream resources. Deployed in dev only.
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: false
  rules:
    - name: validate-service-account-names
      match:
        any:
          - resources:
              kinds:
                - data.nav.no/v1alpha1/UnionTeamServiceAccounts
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          # Do not prevent finalizer cleanup of a previously invalid resource.
          - key: "{{ request.object.metadata.deletionTimestamp || '' }}"
            operator: Equals
            value: ""
      context:
        - name: invalidServiceAccountNames
          variable:
            jmesPath: >-
              request.object.spec.serviceAccounts[].{name: name, errors: ([
                length(name || '') == `0` && 'Name must not be empty.',
                length(name || '') > `63` && 'Name must be at most 63 characters.',
                length(name || '') > `0` && !regex_match('^[a-z]', name) && 'Name must start with a lowercase letter.',
                regex_match('[^a-z0-9-]', name || '') && 'Name must contain only lowercase letters, digits and hyphens.',
                length(name || '') > `0` && !regex_match('[a-z0-9]$', name) && 'Name must end with a lowercase letter or digit.',
                name == 'default' && 'The name "default" is reserved.'
              ] | [?type(@) == 'string'])} | [?length(errors) > `0`]
      validate:
        allowExistingViolations: false
        message: >-
          Invalid service account names: {{ invalidServiceAccountNames }}.
        deny:
          conditions:
            any:
              - key: "{{ length(invalidServiceAccountNames) }}"
                operator: GreaterThan
                value: 0
    - name: validate-external-hosts
      match:
        any:
          - resources:
              kinds:
                - data.nav.no/v1alpha1/UnionTeamServiceAccounts
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: "{{ request.object.metadata.deletionTimestamp || '' }}"
            operator: Equals
            value: ""
      context:
        - name: externalHosts
          variable:
            # Separate the hostname from URL adornments only to diagnose each
            # violation accurately; invalid input is still rejected, not fixed.
            jmesPath: >-
              request.object.spec.serviceAccounts[].{serviceAccount: name, hosts: externalAllowlist[].{
                host: host,
                hostname: split(split(split(split(split(host || '', '://')[-1], '/')[0], '?')[0], '#')[0], ':')[0]
              }}
        - name: invalidExternalHosts
          variable:
            # Report only failed checks, keeping hosts grouped by service account.
            jmesPath: >-
              externalHosts[].{serviceAccount: serviceAccount, hosts: hosts[].{host: host, errors: ([
                contains(host || '', '://') && 'Host must not include a URL scheme; remove the scheme (for example https://).',
                contains(split(split(split(split(host || '', '://')[-1], '/')[0], '?')[0], '#')[0], ':') && 'Host must not include a port; remove the port suffix (for example :443).',
                contains(split(host || '', '://')[-1], '/') && 'Host must not include a path; put allowed paths in the separate paths field.',
                contains(host || '', '?') && 'Host must not include a query string.',
                contains(host || '', '#') && 'Host must not include a fragment.',
                length(hostname) == `0` && 'Hostname must not be empty.',
                regex_match('[A-Z]', hostname) && 'Hostname must be lowercase.',
                regex_match('[[:space:]]', host || '') && 'Host must not contain whitespace.',
                contains(hostname, '*') && 'Wildcard hostnames are not supported.',
                regex_match('[^a-zA-Z0-9.*[:space:]-]', hostname) && 'Hostname contains invalid characters; use letters, digits, dots and hyphens.',
                regex_match('(^[.]|[.][.]|[.]$)', hostname) && 'Hostname must not contain empty dot-separated segments or start or end with a dot.',
                regex_match('(^|[.])-|-([.]|$)', hostname) && 'Dot-separated hostname segments must not start or end with a hyphen.',
                regex_match('[^.]{64}', hostname) && 'A dot-separated hostname segment exceeds the DNS limit of 63 characters; this limit does not apply to the full hostname.',
                length(hostname) > `253` && 'The full hostname exceeds the DNS limit of 253 characters.'
              ] | [?type(@) == 'string'])} | [?length(errors) > `0`]} | [?length(hosts || `[]`) > `0`]
      validate:
        allowExistingViolations: false
        message: >-
          Invalid externalAllowlist hosts: {{ invalidExternalHosts }}.
        deny:
          conditions:
            any:
              - key: "{{ length(invalidExternalHosts) }}"
                operator: GreaterThan
                value: 0
    - name: validate-internal-hosts
      match:
        any:
          - resources:
              kinds:
                - data.nav.no/v1alpha1/UnionTeamServiceAccounts
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: "{{ request.object.metadata.deletionTimestamp || '' }}"
            operator: Equals
            value: ""
      context:
        - name: internalHosts
          variable:
            jmesPath: >-
              request.object.spec.serviceAccounts[].{serviceAccount: name, hosts: internalAllowlist[].{
                host: host,
                hostname: split(split(split(split(split(host || '', '://')[-1], '/')[0], '?')[0], '#')[0], ':')[0]
              }}
        - name: invalidInternalHosts
          variable:
            jmesPath: >-
              internalHosts[].{serviceAccount: serviceAccount, hosts: hosts[].{host: host, errors: ([
                contains(host || '', '://') && 'Host must not include a URL scheme; remove the scheme (for example https://).',
                contains(split(split(split(split(host || '', '://')[-1], '/')[0], '?')[0], '#')[0], ':') && 'Host must not include a port; remove the port suffix (for example :443).',
                contains(split(host || '', '://')[-1], '/') && 'Host must not include a path; put allowed paths in the separate paths field.',
                contains(host || '', '?') && 'Host must not include a query string.',
                contains(host || '', '#') && 'Host must not include a fragment.',
                length(hostname) == `0` && 'Hostname must not be empty.',
                regex_match('[A-Z]', hostname) && 'Hostname must be lowercase.',
                regex_match('[[:space:]]', host || '') && 'Host must not contain whitespace.',
                contains(hostname, '*') && 'Wildcard hostnames are not supported.',
                regex_match('[^a-zA-Z0-9.*[:space:]-]', hostname) && 'Hostname contains invalid characters; use letters, digits, dots and hyphens.',
                regex_match('(^[.]|[.][.]|[.]$)', hostname) && 'Hostname must not contain empty dot-separated segments or start or end with a dot.',
                regex_match('(^|[.])-|-([.]|$)', hostname) && 'Dot-separated hostname segments must not start or end with a hyphen.',
                regex_match('[^.]{64}', hostname) && 'A dot-separated hostname segment exceeds the DNS limit of 63 characters; this limit does not apply to the full hostname.',
                length(hostname) > `253` && 'The full hostname exceeds the DNS limit of 253 characters.'
              ] | [?type(@) == 'string'])} | [?length(errors) > `0`]} | [?length(hosts || `[]`) > `0`]
      validate:
        allowExistingViolations: false
        message: >-
          Invalid internalAllowlist hosts: {{ invalidInternalHosts }}.
        deny:
          conditions:
            any:
              - key: "{{ length(invalidInternalHosts) }}"
                operator: GreaterThan
                value: 0
