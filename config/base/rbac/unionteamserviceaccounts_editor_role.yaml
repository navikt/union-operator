# This rule is not used by the project union-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the data.nav.no.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: union-operator
    app.kubernetes.io/managed-by: kustomize
  name: unionteamserviceaccounts-editor-role
rules:
- apiGroups:
  - data.nav.no
  resources:
  - unionteamserviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - data.nav.no
  resources:
  - unionteamserviceaccounts/status
  verbs:
  - get
