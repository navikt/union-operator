name: Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache CRDs
        uses: actions/cache@v6
        with:
          path: .testdata/crds
          key: crds-${{ hashFiles('go.mod', 'Makefile') }}

      - name: Running Tests
        run: |
          go mod tidy
          make test
