name: Build and push operator image and update deployment image tag 

on:
  push:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache Istio CRDs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testdata/crds
          key: istio-crds-${{ hashFiles('go.mod') }}

      - name: Run tests
        run: |
          go mod tidy
          make test

  build:
    name: Build and push operator image 
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: projects/430580391891/locations/global/workloadIdentityPools/ci-dataplattform/providers/ci-dataplattform
          service_account: ci-dataplattform@nav-data-management-prod.iam.gserviceaccount.com

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        name: Login to Google Artifact Registry
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Create image tag
        id: image_tag
        run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Build and push operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            europe-west1-docker.pkg.dev/nav-data-images-prod/dataplattform-infra/union-operator:${{ env.IMAGE_TAG }}
      
      - name: Update kustomization.yaml with new image tag
        working-directory: config/base/default
        run: |
          kustomize edit set image controller=europe-west1-docker.pkg.dev/nav-data-images-prod/dataplattform-infra/union-operator:${{ env.IMAGE_TAG }}
      
          git config --global user.name ${{ github.actor }}
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "Update image tag to ${{ env.IMAGE_TAG }}"
          git push
